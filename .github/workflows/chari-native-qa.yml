name: Chari Native Migration QA
on:
  push:
    branches: [refactor/chari-native-css-js]
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-chari-native.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/chari-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chari-browser-qa
          path: qa-artifacts/
